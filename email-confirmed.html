<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed - Flowtopsy</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142018;
      --muted: #4d5c52;
      --paper: #f3f6f2;
      --card: #ffffff;
      --accent: #0f7a4c;
      --line: #d5ddd6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #d9efe0 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e7eef2 0%, transparent 50%),
        var(--paper);
    }
    main {
      width: min(100%, 26rem);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: 0 18px 40px rgba(20, 32, 24, 0.08);
    }
    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      margin: 0 0 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.65rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
    }
    .detail {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Flowtopsy</p>
    <span class="badge">Confirmed</span>
    <h1>Email confirmed</h1>
    <p class="lead">Your account is ready.</p>
    <p class="detail">
      Close this tab, open the Flowtopsy extension in Edge, and sign in.
      Free Start Recording unlocks after you sign in with this confirmed email.
    </p>
  </main>
</body>
</html>
