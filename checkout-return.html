<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowtopsy</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142018;
      --muted: #4d5c52;
      --paper: #f3f6f2;
      --card: #ffffff;
      --accent: #0f7a4c;
      --line: #d5ddd6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #d9efe0 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e7eef2 0%, transparent 50%),
        var(--paper);
    }
    main {
      width: min(100%, 26rem);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: 0 18px 40px rgba(20, 32, 24, 0.08);
    }
    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1rem;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      margin: 0 0 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.65rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      color: var(--ink);
    }
    .detail {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      font-weight: 600;
    }
    body.kind-cancel { --accent: #8a6d3b; }
    body.kind-error { --accent: #9b2c2c; }
    body.kind-portal { --accent: #1a5f7a; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Flowtopsy</p>
    <span class="badge" id="badge">Working</span>
    <h1 id="title">Please wait</h1>
    <p class="lead" id="lead"></p>
    <p class="detail" id="detail"></p>
    <p class="hint" id="hint">Close this tab, then click the Flowtopsy icon in the Edge toolbar.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var status = params.get("status") || "success";

      var copy = {
        success: {
          kind: "success",
          badge: "Success",
          title: "You are Pro",
          lead: "Payment successful. Welcome to Flowtopsy Pro.",
          detail: "Open the extension to see unlimited starts. If the plan still says Free, wait a few seconds, then reopen Flowtopsy."
        },
        cancel: {
          kind: "cancel",
          badge: "Canceled",
          title: "Checkout canceled",
          lead: "No charge was made.",
          detail: "You can reopen Flowtopsy anytime and try Pro again when you are ready."
        },
        portal: {
          kind: "portal",
          badge: "Done",
          title: "Billing updated",
          lead: "Your billing change was submitted.",
          detail: "If Pro status looks unchanged, wait a few seconds and reopen the extension."
        },
        error: {
          kind: "error",
          badge: "Action needed",
          title: "Almost there",
          lead: "Payment may have completed.",
          detail: "Open Flowtopsy from the Edge toolbar to refresh your plan."
        }
      };

      var view = copy[status] || copy.success;
      document.body.className = "kind-" + view.kind;
      document.title = view.title + " - Flowtopsy";
      document.getElementById("badge").textContent = view.badge;
      document.getElementById("title").textContent = view.title;
      document.getElementById("lead").textContent = view.lead;
      document.getElementById("detail").textContent = view.detail;
    })();
  </script>
</body>
</html>
