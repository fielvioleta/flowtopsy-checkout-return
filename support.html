<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support - Flowtopsy</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142018;
      --muted: #4d5c52;
      --paper: #f3f6f2;
      --card: #ffffff;
      --accent: #0f7a4c;
      --line: #d5ddd6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #d9efe0 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e7eef2 0%, transparent 50%),
        var(--paper);
    }
    main {
      width: min(100%, 28rem);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: 0 18px 40px rgba(20, 32, 24, 0.08);
    }
    .brand {
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.5rem;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.55rem; }
    p { margin: 0.45rem 0; color: var(--muted); line-height: 1.5; }
    a { color: var(--accent); font-weight: 600; }
    .links { margin-top: 1.25rem; display: grid; gap: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Flowtopsy</p>
    <h1>Support</h1>
    <p>Need help with install, billing, Pro access, or account deletion?</p>
    <p>Email us at <a href="mailto:flowtopsy2026@gmail.com">flowtopsy2026@gmail.com</a>. We usually reply within a few business days.</p>
    <div class="links">
      <a href="privacy.html">Privacy policy</a>
      <a href="index.html">Home</a>
    </div>
  </main>
</body>
</html>
